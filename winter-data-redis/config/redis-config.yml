redis:
    # Reliable queue consumers (Redis Streams + consumer groups, auto-started
    # like the Kafka/SQS modules). Each consumer reads its own stream with its
    # own group: at-least-once delivery, XACK on success, XCLAIM redelivery of
    # stale pending entries, dead-letter stream for poison messages.
    consumers:
        -   name: __default__
            group: winter-queue-group
            workerNum: 1
            blockMs: 5000            # XREADGROUP BLOCK per iteration
            batchSize: 10            # max entries per read
            pollIntervalMs: 0        # extra sleep between iterations
            claimIdleMs: 30000       # reclaim PEL entries idle this long
            reclaimIntervalMs: 5000  # how often to scan for stale entries
            maxDeliveries: 5         # then moved to deadLetterStream
            retries: 3               # in-worker retries on transient errors
            retryWaitMs: 300
            transientExceptions: []
            # deadLetterStream: "{stream}-dlq"
            # trimMaxLen: 100000     # XADD MAXLEN ~ (0 = unbounded)

        -   name: order-events-consumer
            redis: beanUniqueName    # redis bean name; omit for default bean
            stream: order-events
            group: order-events-group
            workerNum: 2
            workerClass: some\package\className
            deadLetterStream: order-events-dlq

phpredis:
    singles:
        -   name: beanUniqueName
            persistence: true
            host: 127.0.0.1
            port: 6379
            timeout: 0
            retryInterval:
            reserved:
            readTimeout: 0

    clusters:
        -   name: beanUniqueName
            clusterName: clusterName
            hosts: [ 127.0.0.1 ]
            timeout: 0
            readTimeout: 0
            persistent: true
            auth: secret

    sentinels:
        -   name: beanUniqueName
            persistence: true
            host: 127.0.0.1
            port: 6379
            timeout: 0
            retryInterval:
            readTimeout: 0

    arrays:
        -   name: beanUniqueName
            arrayName: arrayName
            hosts: [ ],
            options:
                -   consistent: true
                    auth: mysecretpassword
                    function: extract_key_part_func
                    previous: [ ]
                    retry_timeout: 0
                    lazy_connect: false
                    connect_timeout: 0.5
                    read_timeout: 0.5
                    algorithm: sha256
                    distributor: dist_func
    tokens:
        -   name: beanUniqueName123
            hosts:
                -   host: 1270.0.0.1,
                    port: 6371
                    token: 1431655765
                -   host: 1270.0.0.1,
                    port: 6372
                    token: 2863311530
                -   host: 1270.0.0.1,
                    port: 6373
                    token: 4294967295
            persistence: true
            strictTokenRing: false
            timeout: 0
            retryInterval:
            reserved:
            readTimeout: 0,
            hashProvider: dev\winterframework\util\hash\MurmurHash3Provider
